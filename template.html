<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M&amp;A Tracker</title>
<style>
    :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --new: #16a34a;
    --closed: #2563eb;
    --dispute: #dc2626;
}
@media (prefers-color-scheme: dark) {
        :root {
      --bg: #0f1216;
      --card: #171b21;
      --text: #e6e8eb;
      --muted: #8b94a1;
      --border: #262c35;
    }
}
body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
    margin: 0;
}
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 120px;
}
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
}
  .card a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.4;
}
  .card a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: white;
    margin-right: 8px;
  }
  .NEW { background: var(--new); }
  .CLOSED { background: var(--closed); }
  .DISPUTE { background: var(--dispute); }
</style> 
</head>
<body>
<div class="wrap">
  <h1>M&amp;A Tracker</h1>
  <div class="sub">Last updated: UPDATED_HERE (Ontario time)</div>
  <div class="stats">STATS_HERE</div>
  CARDS_HERE
</div>
</body>
</html>
