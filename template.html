<!DOCTYPE html>
<html>
<head>
<meta http-equiv="refresh" content = "900">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M&amp;A Tracker</title>
<style>
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .notes { font-size: 14px; line-height: 1.5; margin-top: 8px;}
    :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --new: #16a34a;
    --closed: #2563eb;
    --dispute: #dc2626;
}
@media (prefers-color-scheme: dark) {
        :root {
      --bg: #0f1216;
      --card: #171b21;
      --text: #e6e8eb;
      --muted: #8b94a1;
      --border: #262c35;
    }
}
body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
    margin: 0;
}
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 120px;
}
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
}
  .card a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.4;
}
  .card a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: white;
    margin-right: 8px;
  }
  .tag[hidden] {
    display: none;
  }
  .ANNOUNCED { background: var(--new); }
  .CLOSED { background: var(--closed); }
  .UNSEEN {
    background: #d97706;
  }
  .hero {
    background: 
     linear-gradient(rgba(10,14,20,0.55), rgba(10,14,20,0.85)),
      url("images/skyline.jpg") center / cover no-repeat;
    color: white;
    padding: 72px 16px 56px;
  }
  .hero-inner { max-width: 900px; margin: 0 auto;}
  .hero h1 { font-size: 34px; margin: 0 0 6px; }
  .hero .sub { color: #cbd2db; margin: 0; }
  .DISPUTE { background: var(--dispute); }
</style> 
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <h1>M&amp;A Tracker</h1>
    <div class="sub">Last updated: UPDATED_HERE (Ontario time)</div>
  </div>
</div>
<div class="wrap">
  <div class="stats">STATS_HERE</div>
  CARDS_HERE
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const cards = document.querySelectorAll(".card[data-deal-id]");
    const STORAGE_KEY = "maTrackerSeenDeals";

    // Load previously viewed deals

    let seenDeals = new Set();
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      seenDeals = new Set(JSON.parse(saved));
    }

    // Mark a deal as viewed
    function markSeen(card) {
        const id = card.dataset.dealId;

        if (seenDeals.has(id)) return;

        seenDeals.add(id);

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify([...seenDeals])
        );

        const badge = card.querySelector(".UNSEEN");

        if (badge) {
            badge.hidden = true;
        }
    }

    // Show badges on deals that haven't been viewed
    cards.forEach(card => {

        const id = card.dataset.dealId;
        const badge = card.querySelector(".UNSEEN");

        if (!seenDeals.has(id)) {
            badge.hidden = false;
        } else {
            badge.hidden = true;
        }

        // Clicking a deal marks it as viewed
        card.querySelector("a").addEventListener("click", () => {
            markSeen(card);
        });

    });

    // Track which deals are visible on screen
    const timers = new Map();

    const observer = new IntersectionObserver(entries => {

        entries.forEach(entry => {

            const card = entry.target;

            if (entry.isIntersecting) {

                if (!timers.has(card)) {

                    const timer = setTimeout(() => {
                        markSeen(card);
                        observer.unobserve(card);
                        timers.delete(card);
                    }, 1000);

                    timers.set(card, timer);
                }

            } else {

                clearTimeout(timers.get(card));
                timers.delete(card);

            }

        });

    }, { threshold: 0.5 });

    cards.forEach(card => {

        if (!seenDeals.has(card.dataset.dealId)) {
            observer.observe(card);
        }

    });

});
</script>
</body>
</html>
